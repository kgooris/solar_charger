<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SolarCharge</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root{
  --bg:#f9fafb;--card:#fff;--card2:#f3f4f6;
  --border:#e5e7eb;--border2:#d1d5db;
  --text:#111827;--text2:#374151;--text3:#6b7280;--text4:#9ca3af;
  --tooltip-bg:#1f2937;--tooltip-text:#f9fafb;
  --green-bg:#f0fdf4;--green-border:#bbf7d0;--green-pulse:#dcfce7;--green-text:#166534;--green-val:#15803d;
  --blue-bg:#eff6ff;--blue-border:#bfdbfe;--blue-hover:#dbeafe;--blue-val:#1d4ed8;
  --orange-bg:#fff7ed;--orange-border:#fed7aa;--orange-text:#9a3412;
  --amber-bg:#fefce8;--amber-border:#fde68a;--amber-text:#854d0e;
  --red-bg:#fef2f2;--red-border:#fecaca;
  --cyan-bg:#e0f2fe;--cyan-val:#0369a1;
  --noplug-bg:#fffbf5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111827;--card:#1f2937;--card2:#374151;
  --border:#374151;--border2:#4b5563;
  --text:#f9fafb;--text2:#e5e7eb;--text3:#9ca3af;--text4:#6b7280;
  --tooltip-bg:#374151;--tooltip-text:#f3f4f6;
  --green-bg:rgba(22,163,74,.12);--green-border:rgba(22,163,74,.35);--green-pulse:rgba(22,163,74,.2);--green-text:#4ade80;--green-val:#4ade80;
  --blue-bg:rgba(59,130,246,.12);--blue-border:rgba(59,130,246,.35);--blue-hover:rgba(59,130,246,.2);--blue-val:#60a5fa;
  --orange-bg:rgba(249,115,22,.12);--orange-border:rgba(249,115,22,.35);--orange-text:#fb923c;
  --amber-bg:rgba(234,179,8,.12);--amber-border:rgba(234,179,8,.35);--amber-text:#fbbf24;
  --red-bg:rgba(220,38,38,.12);--red-border:rgba(220,38,38,.35);
  --cyan-bg:rgba(14,165,233,.12);--cyan-val:#38bdf8;
  --noplug-bg:rgba(249,115,22,.06);
}}
[data-theme=dark]{
  --bg:#111827;--card:#1f2937;--card2:#374151;
  --border:#374151;--border2:#4b5563;
  --text:#f9fafb;--text2:#e5e7eb;--text3:#9ca3af;--text4:#6b7280;
  --tooltip-bg:#374151;--tooltip-text:#f3f4f6;
  --green-bg:rgba(22,163,74,.12);--green-border:rgba(22,163,74,.35);--green-pulse:rgba(22,163,74,.2);--green-text:#4ade80;--green-val:#4ade80;
  --blue-bg:rgba(59,130,246,.12);--blue-border:rgba(59,130,246,.35);--blue-hover:rgba(59,130,246,.2);--blue-val:#60a5fa;
  --orange-bg:rgba(249,115,22,.12);--orange-border:rgba(249,115,22,.35);--orange-text:#fb923c;
  --amber-bg:rgba(234,179,8,.12);--amber-border:rgba(234,179,8,.35);--amber-text:#fbbf24;
  --red-bg:rgba(220,38,38,.12);--red-border:rgba(220,38,38,.35);
  --cyan-bg:rgba(14,165,233,.12);--cyan-val:#38bdf8;
  --noplug-bg:rgba(249,115,22,.06);
}
[data-theme=light]{
  --bg:#f9fafb;--card:#fff;--card2:#f3f4f6;
  --border:#e5e7eb;--border2:#d1d5db;
  --text:#111827;--text2:#374151;--text3:#6b7280;--text4:#9ca3af;
  --tooltip-bg:#1f2937;--tooltip-text:#f9fafb;
  --green-bg:#f0fdf4;--green-border:#bbf7d0;--green-pulse:#dcfce7;--green-text:#166534;--green-val:#15803d;
  --blue-bg:#eff6ff;--blue-border:#bfdbfe;--blue-hover:#dbeafe;--blue-val:#1d4ed8;
  --orange-bg:#fff7ed;--orange-border:#fed7aa;--orange-text:#9a3412;
  --amber-bg:#fefce8;--amber-border:#fde68a;--amber-text:#854d0e;
  --red-bg:#fef2f2;--red-border:#fecaca;
  --cyan-bg:#e0f2fe;--cyan-val:#0369a1;
  --noplug-bg:#fffbf5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.tab-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 1.25rem;position:sticky;top:0;z-index:10;align-items:stretch}
.tab{padding:10px 16px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--green-text);border-bottom-color:#16a34a;font-weight:500}
.tab-content{display:none;padding:0.75rem}
.tab-content.on{display:block}
.panel-controls{display:flex;gap:4px;margin-left:auto;align-items:center;padding:0 4px}
.panel-controls button{background:transparent;border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--text3);font-weight:500;transition:background .15s}
.panel-controls button:hover{background:var(--card2)}

/* header */
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.panel-title{display:flex;align-items:center;gap:8px}
.p-icon{width:32px;height:32px;background:var(--green-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.p-title{font-size:16px;font-weight:600}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500;border:1px solid transparent;display:flex;align-items:center;gap:4px}
.pill-on{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border)}
.pill-wait{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border)}
.pill-off{background:var(--card2);color:var(--text3);border-color:var(--border)}
.pill-noplug{background:var(--orange-bg);color:var(--orange-text);border-color:var(--orange-border)}

/* meters */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:640px){.meters{grid-template-columns:repeat(2,1fr)}}
.meter{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;border-top:3px solid transparent}
.m-solar{border-top-color:#fbbf24}.m-house{border-top-color:#3b82f6}
.m-car{border-top-color:#16a34a}.m-grid{border-top-color:#f59e0b}
.m-lbl{font-size:10px;color:var(--text3);margin-bottom:5px}
.m-val{font-size:17px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.m-unit{font-size:11px;font-weight:400;color:var(--text4)}
.m-sub{font-size:10px;color:var(--text4);margin-top:3px}
.m-solar .m-val{color:#fbbf24}.m-house .m-val{color:var(--blue-val)}
.m-car .m-val{color:var(--green-val)}.m-grid .m-val{color:#f59e0b}

/* sessie banner */
.session-card{background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--border)}
.session-card.active{border-color:var(--green-border)}
.session-card.active .session-title{color:var(--green-text)}
.session-card.noplug{border-color:var(--orange-border);background:var(--noplug-bg)}
.session-card.noplug .session-title{color:var(--orange-text)}
.session-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-green{background:#16a34a;box-shadow:0 0 0 3px var(--green-border);animation:pulse 2s infinite}
.dot-orange{background:#f97316;box-shadow:0 0 0 3px var(--orange-border)}
.dot-grey{background:var(--text4)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--green-border)}50%{box-shadow:0 0 0 6px var(--green-pulse)}}
.session-info{flex:1}
.session-title{font-size:12px;font-weight:600;margin-bottom:2px}
.session-meta{font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap}
.session-kwh{text-align:right;flex-shrink:0}
.session-kwh-val{font-size:16px;font-weight:700;color:var(--green-val);font-variant-numeric:tabular-nums}
.session-kwh-val.inactive{color:var(--text3)}
.session-kwh-lbl{font-size:10px;color:var(--text4)}

/* grafiek */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.chart-title{font-size:12px;font-weight:500}
.chart-sub{font-size:10px;color:var(--text4);margin-top:1px}
.chart-leg{display:flex;gap:10px;font-size:10px;color:var(--text3);flex-wrap:wrap;align-items:center}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
.ld-dash{width:18px;height:0;display:inline-block;margin-right:3px;vertical-align:middle}
.range-btns{display:flex;gap:4px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.rbtn{padding:3px 9px;font-size:11px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text3);cursor:pointer}
.rbtn.on{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);font-weight:500}
input[type=date]{padding:3px 7px;font-size:11px;border:1px solid var(--border);border-radius:5px;color:var(--text2);background:var(--card)}
.zoom-hint{font-size:10px;color:var(--text4);margin-top:4px}
.loading{text-align:center;padding:2rem;color:var(--text4);font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card2);border-radius:8px;padding:9px 10px}
.stat-lbl{font-size:10px;color:var(--text3);margin-bottom:3px}
.stat-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-unit{font-size:10px;font-weight:400;color:var(--text4)}

/* logboek */
.log-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.log-title{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--text2)}
.log-wrap{overflow-x:auto}
.log-table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
.log-table th{text-align:left;padding:5px 8px;color:var(--text4);font-weight:500;border-bottom:1px solid var(--card2);font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.log-table td{padding:7px 8px;border-bottom:1px solid var(--bg);color:var(--text2);white-space:nowrap}
.log-table tr:last-child td{border-bottom:none}
.log-table tr:hover td{background:var(--bg)}
.log-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.badge-ok{background:var(--green-bg);color:var(--green-text)}
.badge-noplug{background:var(--orange-bg);color:var(--orange-text)}
.badge-manual{background:var(--blue-bg);color:var(--blue-val)}
.empty-log{text-align:center;padding:1.5rem;color:var(--text4);font-size:12px}

/* paginering */
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--text3);flex-wrap:wrap;gap:6px}
.page-btns{display:flex;gap:4px;flex-wrap:wrap}
.page-btn{padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text3);cursor:pointer;font-size:11px}
.page-btn.on{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);font-weight:500}
.filter-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filter-label{font-size:11px;color:var(--text3)}

/* instellingen */
.settings-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.settings-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card2);gap:8px}
.srow:last-child{border-bottom:none}
.srow-left{flex:1}
.srow-lbl{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px}
.srow-sub{font-size:11px;color:var(--text4);margin-top:2px}
.srow-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0}
.sinput{width:68px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:5px 7px;text-align:right}
.sunit{font-size:11px;color:var(--text4);width:28px}
.sbtn{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue-val);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:500;transition:background .15s}
.sbtn:hover{background:var(--blue-hover)}
.sbtn.saved{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-sl{position:absolute;inset:0;background:var(--border2);border-radius:20px;cursor:pointer;transition:background .2s}
.tog-sl::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.tog input:checked + .tog-sl{background:#16a34a}
.tog input:checked + .tog-sl::before{transform:translateX(16px)}

/* info tooltip */
.info-btn{width:16px;height:16px;border-radius:50%;background:var(--cyan-bg);border:none;color:var(--cyan-val);font-size:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.info-btn:hover .tooltip{display:block}
.tooltip{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);bottom:auto;right:auto;width:250px;background:var(--tooltip-bg);color:var(--tooltip-text);font-size:11px;line-height:1.6;padding:9px 11px;border-radius:8px;z-index:9999;pointer-events:none;text-align:left;font-weight:400}
.tooltip::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--tooltip-bg)}

/* sensoren */
.sens-title{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sens-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg);font-size:11px}
.sens-row:last-child{border-bottom:none}
.sens-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sens-name{color:var(--text3);min-width:130px;flex-shrink:0}
.sens-id{font-family:'SF Mono',Menlo,monospace;color:var(--text2);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sens-state{font-size:10px;color:var(--text4);margin-left:auto;flex-shrink:0}

.connecting{text-align:center;padding:4rem 2rem;color:var(--text3);font-size:14px}
.error-msg{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:1rem;color:#dc2626;font-size:13px;margin:1rem}
</style>
</head>
<body>

<div class="tab-bar">
  <div class="tab on" data-tab="overview" onclick="switchTab('overview',this)">⚡ Overzicht</div>
  <div class="tab" data-tab="history" onclick="switchTab('history',this)">📊 Historiek</div>
  <div class="tab" data-tab="settings" onclick="switchTab('settings',this)">⚙️ Instellingen</div>
  <div class="panel-controls">
    <button id="btn-lang" onclick="toggleLang()" title="Switch language">EN</button>
    <button id="btn-theme" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
  </div>
</div>

<div id="tab-overview" class="tab-content on">
  <div class="connecting" id="connecting-msg">Verbinding maken met Home Assistant...</div>
</div>
<div id="tab-history" class="tab-content"></div>
<div id="tab-settings" class="tab-content"></div>

function detectLang() {
  const stored = localStorage.getItem('solar_charger_lang');
  if (stored) return stored;
  try {
    const haLang = window.parent.document.querySelector('home-assistant')?.__hass?.language || '';
    if (haLang.startsWith('nl')) return 'nl';
    if (haLang) return 'en';
  } catch(e) {}
  return navigator.language?.startsWith('nl') ? 'nl' : 'en';
}

function applyTheme() {
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  try {
    const bg = getComputedStyle(window.parent.document.documentElement)
      .getPropertyValue('--primary-background-color').trim();
    if (bg) {
      const m = bg.match(/\d+/g);
      if (m && m.length >= 3) dark = (0.299*+m[0] + 0.587*+m[1] + 0.114*+m[2]) / 255 < 0.5;
    }
  } catch(e) {}
  const stored = localStorage.getItem('solar_charger_theme');
  if (stored) dark = stored === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('btn-theme');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
}

function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  localStorage.setItem('solar_charger_theme', dark ? 'dark' : 'light');

// ─────────────────────────────────────────────
// HA WEBSOCKET VERBINDING
// ─────────────────────────────────────────────
class HAConnection {
  constructor() {
    this.ws = null; this.msgId = 1; this.pending = new Map();
    this.subs = new Map(); this.token = null; this.ready = false; this.onReady = null;
  }

  getToken() {
    // Primary: read from parent HA frame — works in Companion app and browser
    try {
      const haEl = window.parent.document.querySelector('home-assistant');
      const token = haEl?.hass?.auth?.data?.access_token;
      if (token) return token;
    } catch(e) {}
    // Fallback: localStorage — works when panel is opened standalone in browser
    try {
      const raw = localStorage.getItem('hassTokens');
      if (!raw) { console.error('[SCC] hassTokens missing'); return null; }
      const tk = JSON.parse(raw);
      if (!tk.access_token) { console.error('[SCC] no access_token'); return null; }
      if (tk.expires && Date.now() > tk.expires) return '__expired__';
      return tk.access_token;
    } catch(e) { return null; }
  }

  connect() {
    if ((this._retries || 0) >= 3) { showError(t('err_connect')); return; }
    this.token = this.getToken();
    if (!this.token) { showError(t('err_no_token')); return; }
    if (this.token === '__expired__') { showError(t('err_expired')); return; }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    this.ws = new WebSocket(`${proto}://${location.host}/api/websocket`);
    this.ws.onmessage = e => { try { this._onMsg(JSON.parse(e.data)); } catch(err) {} };
    this.ws.onerror = () => showError(t('err_ws'));
    this.ws.onclose = e => {
      this.ready = false;
      this._retries = (this._retries || 0) + 1;
      if (this._retries < 3) setTimeout(() => this.connect(), 5000);
      else showError(t('err_closed').replace('{code}', e.code));
    };
  }

  _onMsg(msg) {
    if (msg.type === 'auth_required') {
      this.ws.send(JSON.stringify({ type: 'auth', access_token: this.token }));
    } else if (msg.type === 'auth_ok') {
      this._retries = 0; this.ready = true;
      if (this.onReady) this.onReady();
    } else if (msg.type === 'auth_invalid') {
      showError(t('err_auth'));
    } else if (msg.type === 'result') {
      const cb = this.pending.get(msg.id);
      if (cb) { cb(msg); this.pending.delete(msg.id); }
    } else if (msg.type === 'event') {
      const cb = this.subs.get(msg.id);
      if (cb) cb(msg.event);
    }
  }

  send(msg) {
    return new Promise(resolve => {
      const id = this.msgId++; msg.id = id;
      this.pending.set(id, resolve);
      this.ws.send(JSON.stringify(msg));
    });
  }

  async getStates() { const r = await this.send({ type: 'get_states' }); return r.result || []; }

  async subscribeStates(cb) {
    const id = this.msgId++;
    this.subs.set(id, cb);
    this.ws.send(JSON.stringify({ id, type: 'subscribe_events', event_type: 'state_changed' }));
  }

  async getHistory(entityIds, hoursBack, startIso = null, endIso = null) {
    const start = startIso || new Date(Date.now() - hoursBack * 3600000).toISOString();
    const end   = endIso   || new Date().toISOString();
    const r = await this.send({
      type: 'history/history_during_period',
      start_time: start, end_time: end,
      entity_ids: entityIds,
      significant_changes_only: false, no_attributes: true,
    });
    return r.result || {};
  }

  async callService(domain, service, data) {
    return this.send({ type: 'call_service', domain, service, service_data: data });
  }
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function getState(id) { return states[id] || { state: 'unavailable', attributes: {} }; }
function getFloat(id, fb = 0) { const v = parseFloat(getState(id).state); return isNaN(v) ? fb : v; }
function fmtW(w) { return Math.round(w).toLocaleString(lang === 'nl' ? 'nl-BE' : 'en'); }
function fmtKwh(k) { return parseFloat(k).toFixed(2); }
function _locale() { return lang === 'nl' ? 'nl-BE' : 'en-GB'; }
function fmtTime(iso) {
  if (!iso || iso === '' || iso === 'unknown') return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleTimeString(_locale(), { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(iso) {
  if (!iso || iso === '' || iso === 'unknown') return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString(_locale(), { day: '2-digit', month: '2-digit' });
}
function minsSince(iso) {
  if (!iso || iso === '' || iso === 'unknown') return 0;
  return Math.round((Date.now() - new Date(iso).getTime()) / 60000);
}
function fmtDur(mins) {
  if (mins < 60) return `${mins} ${t('dur_min')}`;
  return `${Math.floor(mins/60)}${t('dur_h')} ${mins%60}${t('dur_min')}`;
}

// ─────────────────────────────────────────────
// BEREKENINGEN
// ─────────────────────────────────────────────
function computeValues() {
  const p1Raw = getFloat(cfg.p1_power_sensor, 0);
  const solar = getFloat(cfg.solar_power_sensor, 0);
  const carW  = cfg.charger_power_sensor
    ? getFloat(cfg.charger_power_sensor, 0)
    : (getState(cfg.charger_switch).state === 'on' ? (cfg.max_charge_kw || 2.3) * 1000 : 0);
  const house = Math.max(solar + p1Raw - carW, 0);
  const gridReturn = Math.max(-p1Raw, 0);
  return { p1Raw, solar, carW, house, gridReturn };
}

// ─────────────────────────────────────────────
// SESSIE TRACKING
// ─────────────────────────────────────────────
async function onSwitchChange(newState, oldState) {
  const chargerOn = newState === 'on';
  const wasOn = oldState === 'on';

  if (chargerOn && !wasOn) {
    const v = computeValues();
    activeSession = {
      startIso: new Date().toISOString(),
      startSurplus: Math.round(-v.p1Raw),
      manual: getState(eid('solar_charger_automation_enabled', 'switch')).state === 'off',
    };
  }

  if (!chargerOn && wasOn && activeSession) {
    if (activeSession.manual) {
      // Manuele sessie: backend slaat niet op (automation was uit), dus frontend doet het
      const stopIso = new Date().toISOString();
      const durMins = Math.round((new Date(stopIso) - new Date(activeSession.startIso)) / 60000);
      const eff = getFloat(eid('solar_charger_efficiency', 'number'), cfg.efficiency_percent || 90) / 100;
      const chargerKwh = cfg.charger_power_sensor
        ? (getFloat(cfg.charger_power_sensor, 0) / 1000 * durMins / 60)
        : ((cfg.max_charge_kw || 2.3) * durMins / 60);
      const noplugThreshold = getFloat(eid('solar_charger_noplug_threshold', 'number'), cfg.noplug_threshold_w || 50);
      const avgPower = cfg.charger_power_sensor ? getFloat(cfg.charger_power_sensor, 0) : 2300;
      const noplug = avgPower < noplugThreshold;
      await saveSessionToHA({
        startIso: activeSession.startIso, stopIso, durMins,
        kwhMuur: parseFloat(chargerKwh.toFixed(3)),
        kwhAccu: parseFloat((chargerKwh * eff).toFixed(3)),
        startSurplus: activeSession.startSurplus,
        status: noplug ? 'noplug' : 'manual',
      });
    }
    // Geautomatiseerde sessies worden door de backend opgeslagen
    _sessionsCache = null;
    refreshOverviewLog();
    activeSession = null;
  }
}

  if (mvCarSub) mvCarSub.textContent = chargerOn ? t('meter_battery_on') : t('meter_battery_off');

  const liveNoplugThr = getFloat(eid('solar_charger_noplug_threshold', 'number'), cfg.noplug_threshold_w || 50);
  const liveMinSurplus = getFloat(eid('solar_charger_min_surplus', 'number'), cfg.min_surplus_w || 500);
  const noplug = chargerOn && v.carW < liveNoplugThr;
  const autoOn = getState(eid('solar_charger_automation_enabled', 'switch')).state === 'on';
  let pillHtml = '';
  if (noplug)        pillHtml = `<span class="pill pill-noplug">${t('pill_noplug')}</span>`;
  else if (chargerOn) pillHtml = `<span class="pill pill-on">${t('pill_charging')}</span>`;
  else if (!autoOn)  pillHtml = `<span class="pill pill-off">${t('pill_off')}</span>`;
  else if (-v.p1Raw >= liveMinSurplus) pillHtml = `<span class="pill pill-wait">${t('pill_surplus')}</span>`;
  else               pillHtml = `<span class="pill pill-off">${t('pill_waiting')}</span>`;
  const pillWrap = document.getElementById('ov-pill-wrap');
  if (pillWrap) pillWrap.innerHTML = pillHtml;

  let sessionKwh = 0;
  if (chargerOn && startIso) {
    const hours = (Date.now() - new Date(startIso).getTime()) / 3600000;
    const powerKw = cfg.charger_power_sensor
      ? getFloat(cfg.charger_power_sensor, 0) / 1000
      : (cfg.max_charge_kw || 2.3);
    sessionKwh = hours * powerKw;
  }

  let bannerHtml = '';
  if (chargerOn) {
    const mins = startIso ? minsSince(startIso) : null;
    const startSurplus = activeSession ? activeSession.startSurplus : '—';
    const cls = noplug ? 'noplug' : 'active';
    const dotCls = noplug ? 'dot-orange' : 'dot-green';
    const title = noplug ? t('sess_noplug') : t('sess_active');
    bannerHtml = `
      <div class="session-card ${cls}">
        <div class="session-dot ${dotCls}"></div>
        <div class="session-info">
          <div class="session-title">${title}</div>
          <div class="session-meta">
            <span>${t('sess_started')} ${fmtTime(startIso)}</span>
            ${mins !== null ? `<span>⌛ ${fmtDur(mins)} ${t('sess_ago_suffix')}</span>` : ''}
            ${startSurplus !== '—' ? `<span>${t('sess_surplus')} ${startSurplus} W</span>` : ''}
          </div>
        </div>
        <div class="session-kwh">
          <div class="session-kwh-val">${fmtKwh(sessionKwh)} <span style="font-size:12px;font-weight:500">kWh</span></div>
          <div class="session-kwh-lbl">${t('sess_this')}</div>
        </div>
      </div>`;
  } else if (allSessions.length > 0) {
    const last = allSessions[0];
    bannerHtml = `
      <div class="session-card">
        <div class="session-dot dot-grey"></div>
        <div class="session-info">
          <div class="session-title" style="color:var(--text3)">${t('sess_last')} ${fmtDate(last.startIso)}</div>
          <div class="session-meta">
            <span>⏱ ${fmtTime(last.startIso)} – ${fmtTime(last.stopIso)}</span>
            <span>⌛ ${fmtDur(last.durMins)}</span>
            <span>${t('sess_surplus')} ${last.startSurplus} W</span>
          </div>
        </div>
        <div class="session-kwh">
          <div class="session-kwh-val inactive">${fmtKwh(last.kwhMuur)} <span style="font-size:12px;font-weight:500">kWh</span></div>
          <div class="session-kwh-lbl">${t('sess_last_lbl')}</div>
        </div>
      </div>`;
  }
  const sessionEl = document.getElementById('ov-session');
  if (sessionEl) sessionEl.innerHTML = bannerHtml;

  const todayCount = allSessions.filter(s => {
    const d = new Date(s.startIso); const n = new Date();
    return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  }).length;
  const stToday    = document.getElementById('ov-stat-today');
  const stBatt     = document.getElementById('ov-stat-batt');
  const stSessions = document.getElementById('ov-stat-sessions');
  const stTotal    = document.getElementById('ov-stat-total');
  if (stToday)    stToday.innerHTML    = `${fmtKwh(energyToday)}<span class="stat-unit"> kWh</span>`;
  if (stBatt)     stBatt.innerHTML     = `${fmtKwh(energyBatt)}<span class="stat-unit"> kWh</span>`;
  if (stSessions) stSessions.textContent = todayCount;
  if (stTotal)    stTotal.innerHTML    = `${fmtKwh(energyTotal)}<span class="stat-unit"> kWh</span>`;
}

async function renderChart1() {
  const hours = chart1Range === '1h' ? 1 : chart1Range === 'today' ? 24 : 168;
  const surplusId = eid('solar_charger_min_surplus', 'number');
  const entityIds = [cfg.p1_power_sensor, surplusId];
  if (cfg.charger_power_sensor) entityIds.push(cfg.charger_power_sensor);

  const history = chart1StartIso
    ? await ha.getHistory(entityIds, 0, chart1StartIso, chart1EndIso || new Date().toISOString())
    : await ha.getHistory(entityIds, hours);

  const p1History  = history[cfg.p1_power_sensor] || [];
  const carHistory = cfg.charger_power_sensor ? (history[cfg.charger_power_sensor] || []) : [];
  const thrHistory = (history[surplusId] || []).filter(p => !isNaN(parseFloat(p.s))).sort((a, b) => a.lu - b.lu);

  const locale = _locale();
  const labels = [], p1D = [], carD = [];
  p1History.forEach(point => {
    const v = parseFloat(point.s);
    if (isNaN(v)) return;
    labels.push(new Date(point.lu * 1000).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }));
    p1D.push(v);
  });

  if (carHistory.length > 0) {
    p1History.forEach(p1pt => {
      let closest = carHistory[0];
      for (const cp of carHistory) {
        if (Math.abs(cp.lu - p1pt.lu) < Math.abs(closest.lu - p1pt.lu)) closest = cp;
      }
      const v = parseFloat(closest.s);
      carD.push(isNaN(v) ? null : v);
    });
  } else {
    p1D.forEach(() => carD.push(null));
  }

  // Pas P1 aan: trek laadvermogen af zodat de lijn "huisverbruik excl lading" toont
  if (cfg.charger_power_sensor) {
    for (let i = 0; i < p1D.length; i++) {
      if (carD[i] !== null) p1D[i] -= carD[i];
    }
  }

  // Build step-function threshold from historical min_surplus values
  const thrD = [];
  if (thrHistory.length > 0) {
    p1History.forEach(p1pt => {
      let val = null;
      for (const tp of thrHistory) {
        if (tp.lu <= p1pt.lu) val = -parseFloat(tp.s);
      }
      thrD.push(val);
    });
  } else {
    const fallback = -(cfg.min_surplus_w || getFloat(surplusId, 500));
    p1History.forEach(() => thrD.push(fallback));
  }

  // Downsample for performance: keep at most 800 points before charting
  if (labels.length > 800) {
    const step = labels.length / 800;
    const pick = i => Math.round(i * step);
    const sl = (a) => Array.from({ length: 800 }, (_, i) => a[pick(i)]);
    labels.splice(0, labels.length, ...sl(labels));
    p1D.splice(0, p1D.length, ...sl(p1D));
    carD.splice(0, carD.length, ...sl(carD));
    thrD.splice(0, thrD.length, ...sl(thrD));
  }

  const canvas = document.getElementById('chart1');
  if (!canvas) return;
  if (chart1) { chart1.destroy(); chart1 = null; }

  // Plugin: synchronise right axis range with left axis so 100 W aligns on both sides
  const rightAxisSyncPlugin = {
    id: 'rightAxisSync',
    afterDataLimits(chart, args) {
      if (args.scale.id !== 'yright') return;
      const y = chart.scales.y;
      if (!y) return;
      args.scale.min = y.min;
      args.scale.max = y.max;
    },
  };

  chart1 = new Chart(canvas, {
    plugins: [rightAxisSyncPlugin],
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: t('chart1_leg_p1'),
          data: p1D,
          borderColor: ctx => {
            const chart = ctx.chart;
            const { ctx: c, chartArea } = chart;
            if (!chartArea) return '#3b82f6';
            const yZero = chart.scales.y.getPixelForValue(0);
            const ratio = Math.max(0.001, Math.min(0.999, (yZero - chartArea.top) / (chartArea.bottom - chartArea.top)));
            const grad = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            grad.addColorStop(0, '#3b82f6');
            grad.addColorStop(ratio - 0.001, '#3b82f6');
            grad.addColorStop(ratio + 0.001, '#f59e0b');
            grad.addColorStop(1, '#f59e0b');
            return grad;
          },
          backgroundColor: ctx => {
            const chart = ctx.chart;
            const { ctx: c, chartArea } = chart;
            if (!chartArea) return 'transparent';
            const yZero = chart.scales.y.getPixelForValue(0);
            const ratio = Math.max(0.001, Math.min(0.999, (yZero - chartArea.top) / (chartArea.bottom - chartArea.top)));
            const grad = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            grad.addColorStop(0, 'rgba(59,130,246,0.25)');
            grad.addColorStop(ratio - 0.001, 'rgba(59,130,246,0.05)');
            grad.addColorStop(ratio + 0.001, 'rgba(245,158,11,0.05)');
            grad.addColorStop(1, 'rgba(245,158,11,0.25)');
            return grad;
          },
          fill: 'origin', tension: 0.3, pointRadius: 0, borderWidth: 2, yAxisID: 'y',
        },
        {
          label: t('chart1_leg_bat'),
          data: carD,
          borderColor: 'rgba(22,163,74,0.45)',
          backgroundColor: 'rgba(22,163,74,0.07)',
          fill: 'origin', tension: 0.3, pointRadius: 0, borderWidth: 1.5,
          spanGaps: true, yAxisID: 'yright',
        },
        {
          label: t('chart1_leg_thr'),
          data: thrD,
          borderColor: '#8b5cf6', borderDash: [5, 4], borderWidth: 1.5,
          pointRadius: 0, fill: false, yAxisID: 'y', stepped: 'before',
        },
      ],
    },
    options: {
      responsive: true, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: tooltipBg(), titleColor: axisColor(),
          bodyColor: isDark() ? '#f3f4f6' : '#f9fafb',
          borderColor: isDark() ? '#4b5563' : '#374151', borderWidth: 1,
          mode: 'index', intersect: false,
          callbacks: {
            label: ctx => {
              if (ctx.datasetIndex === 0) {
                const v = ctx.parsed.y;
                if (v > 0) return ` ${t('tip_take')}: ${Math.round(v)} W`;
                if (v < 0) return ` ${t('tip_return')}: ${Math.abs(Math.round(v))} W`;
                return null;
              }
              if (ctx.datasetIndex === 1 && ctx.parsed.y > 0)
                return ` ${t('tip_battery')}: ${Math.round(ctx.parsed.y)} W`;
              if (ctx.datasetIndex === 2)
                return ` ${t('tip_threshold')}: ${Math.abs(Math.round(ctx.parsed.y))} W`;
              return null;
            },
          },
        },
        zoom: {
          pan: { enabled: true, mode: 'x' },
          zoom: { wheel: { enabled: true, modifierKey: 'ctrl' }, pinch: { enabled: true }, mode: 'x' },
        },
      },
      scales: {
        x: {
          grid: { color: gridColor() },
          ticks: { color: tickColor(), font: { size: 10 }, maxTicksLimit: 8 },
        },
        y: {
          grid: {
            color: ctx => ctx.tick.value === 0 ? gridZero() : gridColor(),
            lineWidth: ctx => ctx.tick.value === 0 ? 2 : 1,
          },
          ticks: {
            color: ctx => ctx.tick.value >= 0 ? '#3b82f6' : '#f59e0b',
            font: { size: 10 },
            callback: v => v > 0 ? `+${Math.round(v)}W` : `${Math.round(v)}W`,
          },
          title: { display: true, text: t('chart1_yaxis'), color: axisColor(), font: { size: 10 } },
        },
        yright: {
          position: 'right',
          grid: { display: false },
          ticks: { color: 'rgba(22,163,74,0.6)', font: { size: 10 }, callback: v => v > 0 ? `${Math.round(v)}W` : '' },
          title: { display: true, text: t('chart1_yright'), color: 'rgba(22,163,74,0.6)', font: { size: 10 } },
        },
      },
    },
  });
}

function setChart1Range(range, btn) {
  chart1Range = range;
  chart1StartIso = null;
  chart1EndIso = null;
  const today  = new Date().toISOString().slice(0, 10);
  const fromEl = document.getElementById('c1-from');
  const toEl   = document.getElementById('c1-to');
  if (fromEl && toEl) {
    if (range === 'today' || range === '1h') {
      fromEl.value = today; toEl.value = today;
    } else if (range === '7d') {
      const d = new Date(); d.setDate(d.getDate() - 7);
      fromEl.value = d.toISOString().slice(0, 10); toEl.value = today;
    } else {
      fromEl.value = ''; toEl.value = '';
    }
  }
  document.querySelectorAll('#tab-overview .rbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderChart1();
}

function applyChart1Date() {
  const from = document.getElementById('c1-from').value;
  const to   = document.getElementById('c1-to').value;
  if (!from && !to) return;

  document.querySelectorAll('#tab-overview .rbtn').forEach(b => b.classList.remove('on'));

}

function renderHistLog() {
  const total = histFiltered.length;
  const pages = Math.max(1, Math.ceil(total / HIST_PER_PAGE));
  histPage = Math.min(histPage, pages);
  const slice = histFiltered.slice((histPage-1)*HIST_PER_PAGE, histPage*HIST_PER_PAGE);

  const rows = slice.length === 0
    ? `<tr><td colspan="8" class="empty-log">${t('log_empty2')}</td></tr>`
    : slice.map(s => `<tr>
        <td>${fmtDate(s.startIso)}</td>
        <td>${fmtTime(s.startIso)}</td>
        <td>${fmtTime(s.stopIso)}</td>
        <td>${fmtDur(s.durMins)}</td>
        <td>${fmtKwh(s.kwhMuur)}</td>
        <td>${fmtKwh(s.kwhAccu)}</td>
        <td>${s.startSurplus} W</td>
        <td>${badgeHtml(s.status)}</td>
      </tr>`).join('');

  document.getElementById('hist-log-body').innerHTML = rows;
  document.getElementById('hist-page-info').textContent =
    t('log_page').replace('{total}', total).replace('{page}', histPage).replace('{pages}', pages);
  const pb = document.getElementById('hist-page-btns');
  pb.innerHTML = '';
  for (let p = 1; p <= pages; p++) {
    const b = document.createElement('button');
    b.className = 'page-btn' + (p===histPage?' on':'');
    b.textContent = p;
    b.onclick = () => { histPage=p; renderHistLog(); };
    pb.appendChild(b);
  }
  const lc = document.getElementById('log-count');
  if (lc) lc.textContent = t('log_count').replace('{total}', total);
}

function renderSettings() {
  const autoEnabled = getState(eid('solar_charger_automation_enabled', 'switch')).state === 'on';

  // Read live values from HA number entities; fall back to cfg defaults
  const minSurplus   = getFloat(eid('solar_charger_min_surplus',      'number'), cfg.min_surplus_w     || 500);
  const delayOn      = getFloat(eid('solar_charger_delay_on',          'number'), cfg.delay_on_seconds  || 120);
  const delayOff     = getFloat(eid('solar_charger_delay_off',         'number'), cfg.delay_off_seconds || 180);
  const efficiencyV  = getFloat(eid('solar_charger_efficiency',        'number'), cfg.efficiency_percent || 90);
  const noplugThresh = getFloat(eid('solar_charger_noplug_threshold',  'number'), cfg.noplug_threshold_w || 50);

  const sensors = [
    [t('sens_p1'),     cfg.p1_power_sensor],
    [t('sens_solar'),  cfg.solar_power_sensor],
    [t('sens_switch'), cfg.charger_switch],
    [t('sens_power'),  cfg.charger_power_sensor || t('sens_not_cfg')],
  ];

  document.getElementById('tab-settings').innerHTML = `
    <div class="settings-card">
      <div class="settings-title">${t('set_automation')}</div>
      ${settingToggle(t('set_auto_toggle'), eid('solar_charger_automation_enabled', 'switch'), autoEnabled)}
      ${settingNumber(t('set_min_surplus'), 'min_surplus_w', minSurplus, 'W', 0, 5000, 50)}
      ${settingNumber(t('set_delay_on'), 'delay_on_seconds', delayOn, 's', 30, 600, 30)}
      ${settingNumber(t('set_delay_off'), 'delay_off_seconds', delayOff, 's', 30, 600, 30)}
    </div>

    <div class="settings-card">
      <div class="settings-title">${t('set_energy')}</div>
      ${settingNumberInfo(t('set_efficiency'), 'efficiency_percent', efficiencyV, '%', 70, 100, 1, t('set_efficiency_tip'))}
      ${settingNumberInfo(t('set_noplug'), 'noplug_threshold_w', noplugThresh, 'W', 0, 200, 10, t('set_noplug_tip'))}
    </div>

    <div class="settings-card">
      <div class="sens-title">${t('set_sensors')}</div>
      ${sensors.map(([name, id]) => {
        if (!id || id === t('sens_not_cfg')) return '';
        const s = getState(id);
        const ok = s.state !== 'unavailable' && s.state !== 'unknown';
        return `<div class="sens-row">
          <span class="sens-dot" style="background:${ok?'#16a34a':'#ef4444'}"></span>
          <span class="sens-name">${name}</span>
          <span class="sens-id">${id}</span>
          <span class="sens-state">${s.state !== 'unavailable' ? s.state + (s.attributes.unit_of_measurement||'') : t('sens_unavailable')}</span>
        </div>`;
      }).join('')}
      <div style="margin-top:10px;font-size:11px;color:var(--text4)">${t('set_sensors_note')}</div>
    </div>`;
}

function settingToggle(label, haEntity, checked) {
  return `<div class="srow">
    <div class="srow-left"><div class="srow-lbl">${label}</div></div>
    <label class="tog">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleEntity('${haEntity}',this.checked)">
      <span class="tog-sl"></span>
    </label>
  </div>`;
}

function settingNumber(label, key, val, unit, min, max, step) {
  return `<div class="srow">
    <div class="srow-left"><div class="srow-lbl">${label}</div></div>
    <div class="srow-ctrl">
      <input class="sinput" id="set-${key}" type="number" value="${val}" min="${min}" max="${max}" step="${step}">
      <span class="sunit">${unit}</span>
      <button class="sbtn" id="btn-${key}" onclick="saveSetting('${key}')">${t('set_save')}</button>
    </div>
  </div>`;
}

function settingNumberInfo(label, key, val, unit, min, max, step, tooltipHtml) {
  return `<div class="srow">
    <div class="srow-left">
      <div class="srow-lbl">${label}
        <div class="info-btn">?<div class="tooltip">${tooltipHtml}</div></div>
      </div>
    </div>
    <div class="srow-ctrl">
      <input class="sinput" id="set-${key}" type="number" value="${val}" min="${min}" max="${max}" step="${step}">
      <span class="sunit">${unit}</span>
      <button class="sbtn" id="btn-${key}" onclick="saveSetting('${key}')">${t('set_save')}</button>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// ACTIES
// ─────────────────────────────────────────────
async function toggleEntity(entity, enabled) {
  const [domain, service] = entity.startsWith('input_boolean')
    ? ['input_boolean', enabled ? 'turn_on' : 'turn_off']
    : ['switch', enabled ? 'turn_on' : 'turn_off'];
  await ha.callService(domain, service, { entity_id: entity });
}

async function saveSetting(key) {
  const input = document.getElementById('set-' + key);
  const btn   = document.getElementById('btn-' + key);
  if (!input || !btn) return;
  const val = parseFloat(input.value);
  cfg[key] = val;
  const entityMap = {
    min_surplus_w:       eid('solar_charger_min_surplus',      'number'),
    delay_on_seconds:    eid('solar_charger_delay_on',          'number'),
    delay_off_seconds:   eid('solar_charger_delay_off',         'number'),
    efficiency_percent:  eid('solar_charger_efficiency',        'number'),
    noplug_threshold_w:  eid('solar_charger_noplug_threshold',  'number'),
  };
  const entityId = entityMap[key];
  if (entityId) {
    await ha.callService('number', 'set_value', { entity_id: entityId, value: val });
  }
  btn.textContent = t('set_saved');
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = t('set_save'); btn.classList.remove('saved'); }, 2000);
}

// ─────────────────────────────────────────────
// HELPERS UI
// ─────────────────────────────────────────────
function badgeHtml(status) {
  if (status === 'noplug') return `<span class="log-badge badge-noplug">${t('badge_noplug')}</span>`;
  if (status === 'manual') return `<span class="log-badge badge-manual">${t('badge_manual')}</span>`;
  return `<span class="log-badge badge-ok">${t('badge_ok')}</span>`;
}

async function switchTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('on'));
  document.getElementById('tab-' + name).classList.add('on');
  el.classList.add('on');
  if (name === 'history') await renderHistory();
  if (name === 'settings') renderSettings();
}

function showError(msg) {
  document.getElementById('tab-overview').innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

// ─────────────────────────────────────────────
// STATE CHANGE HANDLER
// ─────────────────────────────────────────────
const WATCHED = () => [
  cfg.p1_power_sensor, cfg.solar_power_sensor,
  cfg.charger_switch, cfg.charger_power_sensor,
  eid('solar_charger_energy_today',            'number'),
  eid('solar_charger_energy_in_battery_today', 'number'),
  eid('solar_charger_energy_total',            'number'),
  eid('solar_charger_session_start',           'text'),
  eid('solar_charger_automation_enabled',      'switch'),
].filter(Boolean);

function onStateChange(event) {
  const { entity_id, new_state, old_state } = event.data;
  if (!new_state) return;
  states[entity_id] = new_state;
  if (entity_id === cfg.charger_switch) {
    onSwitchChange(new_state.state, old_state ? old_state.state : prevSwitchState);
    prevSwitchState = new_state.state;
  }
  if (WATCHED().includes(entity_id)) renderOverview();
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  await loadConfig();

  if (!cfg.p1_power_sensor) {
    showError(t('err_no_cfg'));
    return;
  }

  // Update tab labels now that lang is set
  updateTabLabels();

  // Watch parent HA document for theme changes (same-origin iframe)
  try {
    const obs = new MutationObserver(() => {
      if (!localStorage.getItem('solar_charger_theme')) {
        applyTheme();
        if (chart1) renderChart1();
        if (chart2) renderChart2(_lastChart2Sessions);
      }
    });
    obs.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
  } catch(e) {}

  ha.onReady = async () => {
    const allStates = await ha.getStates();
    allStates.forEach(s => { states[s.entity_id] = s; });
    prevSwitchState = getState(cfg.charger_switch).state;
    renderOverview();
    ha.subscribeStates(onStateChange);
  };

  ha.connect();
}

init();
</script>
</body>
</html>
